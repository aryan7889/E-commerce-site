<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

    <div class="box">

        <h1>Login</h1>

        <form id="loginForm">

            <input
                type="email"
                placeholder="Email"
                id="email"
            >

            <input
                type="password"
                placeholder="Password"
                id="password"
            >

            <button>
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>
        </p>

    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
