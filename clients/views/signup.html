<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">

    <div class="box">

        <h1>Create Account</h1>

        <form id="signupForm">

            <input
                type="text"
                placeholder="Name"
                id="name"
            >

            <input
                type="email"
                placeholder="Email"
                id="email"
            >

            <input
                type="password"
                placeholder="Password"
                id="password"
            >

            <button>
                Sign Up
            </button>

        </form>

        <p>
            Already have an account?

            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>

<script src="../js/signup.js"></script>

</body>
</html>
